name: "TODO Scanner (Weekly)"

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 9:00 UTC
  workflow_dispatch: {}   # Manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout devin_automation
        uses: actions/checkout@v4

      - name: Checkout superset_fork
        uses: actions/checkout@v4
        with:
          repository: AshNguyen125/superset_fork
          ref: d3-localization
          path: superset_fork

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run scanner
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
        run: python -m src.scanner --repo-path ./superset_fork

      - name: Commit report
        run: |
          git config user.name "devin-automation[bot]"
          git config user.email "devin-automation@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "chore: update TODO scan report $(date +%Y-%m-%d)"
          git push
