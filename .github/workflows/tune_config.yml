name: "Config Tuner (Meta-Automation)"

on:
  schedule:
    - cron: "0 10 * * 1"  # Weekly check at 10:00 UTC Monday; actual cadence gated by config.yaml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and log decisions but don't edit config or open a PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout devin_automation
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Cadence gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          elif python -m src.gate tuner; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tuner
        if: steps.gate.outputs.due == 'true'
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "devin-automation[bot]"
          git config user.email "devin-automation@users.noreply.github.com"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.tuner --dry-run
          else
            python -m src.tuner
          fi
