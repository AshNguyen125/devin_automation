name: "TODO Resolver (Every 3 Days)"

on:
  schedule:
    - cron: "0 9 */3 * *"  # Every 3 days at 9:00 UTC
  workflow_dispatch: {}     # Manual trigger

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout devin_automation
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run resolver
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
        run: python -m src.resolver

      - name: Commit updated report
        run: |
          git config user.name "devin-automation[bot]"
          git config user.email "devin-automation@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "chore: update TODO report with resolver results $(date +%Y-%m-%d)"
          git push
