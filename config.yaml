target_repo:
  owner: AshNguyen125
  name: superset_fork
  branch: d3-localization
  github_url: https://github.com/AshNguyen125/superset_fork
devin:
  org_id: org-d0f9923180b94f74931a4ac1006c0a25
  api_base: https://api.devin.ai/v3
scanner:
  scan_dirs:
  - superset/
  - superset-frontend/src/
  markers:
  - TODO
  - FIXME
  - HACK
  - XXX
  context_lines: 5
  max_todos: 100
  cadence_days: 14
resolver:
  time_budget_minutes: 10
  wrap_up_buffer_minutes: 1
  max_items: 10
  cadence_days: 3
tuner:
  cadence_days: 30
  min_scanner_runs: 3
  min_resolver_runs: 3
  cooldown_days: 30
  max_steps_per_change: 1
  min_confidence: medium
  ladders:
    scanner.cadence_days:
    - 7
    - 14
    - 21
    - 30
    resolver.cadence_days:
    - 1
    - 2
    - 3
    - 5
    - 7
    resolver.time_budget_minutes:
    - 5
    - 10
    - 15
    - 20
    - 30
    - 45
    - 60
    resolver.max_items:
    - 3
    - 5
    - 10
    - 15
    - 20
reports:
  output_dir: reports/
